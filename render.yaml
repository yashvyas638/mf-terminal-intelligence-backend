services:
  - type: web
    name: mf-terminal-intelligence-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.lock
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.16"
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        generateValue: true
      - key: MINIMUM_VALID_RECORDS
        value: "1000"
      - key: MAX_NAV_STALENESS_DAYS
        value: "7"
      - key: ENVIRONMENT
        value: production