services:
  - type: web
    name: mf-terminal-nav-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        generateValue: true
      - key: MINIMUM_VALID_RECORDS
        value: "1000"
      - key: ENVIRONMENT
        value: production