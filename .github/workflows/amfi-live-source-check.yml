name: AMFI live source validation
on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-6"
permissions:
  contents: read
jobs:
  validate-live-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - name: Fetch and validate current AMFI response without database writes
        run: |
          python - <<'PY'
          import json
          import requests
          from app.nav_ingest import AMFI_NAV_URL, parse_amfi_nav_text

          response = requests.get(
              AMFI_NAV_URL,
              timeout=(10, 60),
              headers={"User-Agent": "MF-Terminal-Intelligence-Live-Validation/1.0"},
          )
          response.raise_for_status()
          payload = response.content.decode("utf-8-sig", errors="strict")
          records, report = parse_amfi_nav_text(payload)
          if report["records_valid"] < 1000:
              raise SystemExit(f"AMFI returned only {report['records_valid']} valid rows")
          print(json.dumps({
              "source": AMFI_NAV_URL,
              "records_valid": report["records_valid"],
              "unique_scheme_codes": report["unique_scheme_codes"],
              "min_nav_date": report["min_nav_date"],
              "max_nav_date": report["max_nav_date"],
              "invalid_rows": report["invalid_rows"],
              "duplicate_rows_skipped": report["duplicate_rows_skipped"],
              "payload_sha256": report["payload_sha256"],
          }, indent=2))
          PY
      - name: Fetch and validate AMFI historical archive without database writes
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          from app.nav_backfill import HistoryWindow
          from app.nav_history_source import fetch_amfi_history_window

          # A rolling seven-calendar-day window includes recent business days
          # while staying well below AMFI's documented 90-day maximum.
          end_date = datetime.now(ZoneInfo("Asia/Kolkata")).date() - timedelta(days=1)
          start_date = end_date - timedelta(days=6)
          window = HistoryWindow(start_date, end_date)

          # Open-ended schemes provide a broad, stable sample for validating
          # the archive wire format. This is a read-only source smoke test.
          records, report = fetch_amfi_history_window(window, 1, max_attempts=3)
          if report.get("header_verified") is not True:
              raise SystemExit("Historical archive header was not verified")
          if report["records_valid"] < 1000:
              raise SystemExit(
                  f"Historical archive returned only {report['records_valid']} valid rows"
              )
          if report["min_nav_date"] < start_date.isoformat():
              raise SystemExit("Historical archive contains dates before the requested range")
          if report["max_nav_date"] > end_date.isoformat():
              raise SystemExit("Historical archive contains dates after the requested range")

          print(json.dumps({
              "source": report["source_url"],
              "scheme_type": report["scheme_type"],
              "requested_start_date": report["requested_start_date"],
              "requested_end_date": report["requested_end_date"],
              "http_status": report["http_status"],
              "bytes_received": report["bytes_received"],
              "records_valid": report["records_valid"],
              "unique_scheme_codes": report["unique_scheme_codes"],
              "min_nav_date": report["min_nav_date"],
              "max_nav_date": report["max_nav_date"],
              "header_verified": report["header_verified"],
              "invalid_rows": report["invalid_rows"],
              "duplicate_rows_skipped": report["duplicate_rows_skipped"],
              "payload_sha256": report["payload_sha256"],
          }, indent=2))
          PY
