name: AMFI live source validation
on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-6"
permissions:
  contents: read
jobs:
  validate-live-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - name: Fetch and validate current AMFI response without database writes
        run: |
          python - <<'PY'
          import json
          import requests
          from app.nav_ingest import AMFI_NAV_URL, parse_amfi_nav_text

          response = requests.get(
              AMFI_NAV_URL,
              timeout=(10, 60),
              headers={"User-Agent": "MF-Terminal-Intelligence-Live-Validation/1.0"},
          )
          response.raise_for_status()
          payload = response.content.decode("utf-8-sig", errors="strict")
          records, report = parse_amfi_nav_text(payload)
          if report["records_valid"] < 1000:
              raise SystemExit(f"AMFI returned only {report['records_valid']} valid rows")
          print(json.dumps({
              "source": AMFI_NAV_URL,
              "records_valid": report["records_valid"],
              "unique_scheme_codes": report["unique_scheme_codes"],
              "min_nav_date": report["min_nav_date"],
              "max_nav_date": report["max_nav_date"],
              "invalid_rows": report["invalid_rows"],
              "duplicate_rows_skipped": report["duplicate_rows_skipped"],
              "payload_sha256": report["payload_sha256"],
          }, indent=2))
          PY
      - name: Fetch and validate AMFI historical archives without database writes
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          from app.nav_backfill import HistoryWindow
          from app.nav_history_source import fetch_amfi_history_window

          end_date = datetime.now(ZoneInfo("Asia/Kolkata")).date() - timedelta(days=1)
          start_date = end_date - timedelta(days=6)
          window = HistoryWindow(start_date, end_date)
          summaries = []

          # Validate open-ended, close-ended, and interval scheme types.
          for scheme_type in (1, 2, 3):
              records, report = fetch_amfi_history_window(
                  window, scheme_type, max_attempts=3
              )
              if report.get("header_verified") is not True:
                  raise SystemExit(
                      f"AMFI type {scheme_type} historical archive header was not verified"
                  )
              if report["records_valid"] < (1000 if scheme_type == 1 else 1):
                  raise SystemExit(
                      f"AMFI type {scheme_type} returned only {report['records_valid']} valid rows"
                  )
              if any(row.nav_date < start_date or row.nav_date > end_date for row in records):
                  raise SystemExit(
                      f"AMFI type {scheme_type} contains dates outside the requested range"
                  )

              summaries.append({
                  "scheme_type": scheme_type,
                  "source": report["source_url"],
                  "http_status": report["http_status"],
                  "requested_start_date": report["requested_start_date"],
                  "requested_end_date": report["requested_end_date"],
                  "bytes_received": report["bytes_received"],
                  "records_valid": report["records_valid"],
                  "unique_scheme_codes": report["unique_scheme_codes"],
                  "min_nav_date": report["min_nav_date"],
                  "max_nav_date": report["max_nav_date"],
                  "schema_variant": report["schema_variant"],
                  "invalid_rows": report["invalid_rows"],
                  "invalid_issue_counts": report["invalid_issue_counts"],
                  "payload_sha256": report["payload_sha256"],
              })

          print(json.dumps({"scheme_type_checks": summaries, "database_writes": 0}, indent=2))
          PY
