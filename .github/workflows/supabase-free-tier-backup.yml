name: Supabase Free-Tier Encrypted Backup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-free-tier-backup.yml"
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: supabase-free-tier-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate backup configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$SUPABASE_DB_URL" ]] || missing+=("SUPABASE_DB_URL")
          [[ -n "$BACKUP_AGE_RECIPIENT" ]] || missing+=("BACKUP_AGE_RECIPIENT")
          [[ -n "$BACKUP_S3_BUCKET" ]] || missing+=("BACKUP_S3_BUCKET")
          [[ -n "$BACKUP_S3_ENDPOINT" ]] || missing+=("BACKUP_S3_ENDPOINT")
          [[ -n "$AWS_ACCESS_KEY_ID" ]] || missing+=("BACKUP_S3_ACCESS_KEY_ID")
          [[ -n "$AWS_SECRET_ACCESS_KEY" ]] || missing+=("BACKUP_S3_SECRET_ACCESS_KEY")
          if (( ${#missing[@]} )); then
            printf '::error::Missing required GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          [[ "$SUPABASE_DB_URL" == postgres://* || "$SUPABASE_DB_URL" == postgresql://* ]] || {
            echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection URI.";
            exit 1;
          }
          [[ "$BACKUP_AGE_RECIPIENT" == age1* ]] || {
            echo "::error::BACKUP_AGE_RECIPIENT must be an age public recipient, never a private identity.";
            exit 1;
          }
          [[ "$BACKUP_S3_ENDPOINT" == https://* ]] || {
            echo "::error::BACKUP_S3_ENDPOINT must use HTTPS.";
            exit 1;
          }

      - name: Install Supabase CLI and age
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: 3.2.0

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Validate encryption recipient and off-site bucket
        shell: bash
        run: |
          set -euo pipefail
          printf 'backup-recipient-preflight' | age --encrypt --recipient "$BACKUP_AGE_RECIPIENT" >/dev/null
          aws s3api head-bucket --bucket "$BACKUP_S3_BUCKET" \
            --endpoint-url "$BACKUP_S3_ENDPOINT" --region auto

      - name: Export, checksum and encrypt database
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/mf-terminal-backup"
          mkdir -p "$WORK"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          ARCHIVE="$RUNNER_TEMP/mf-terminal-intelligence-$STAMP.tar.gz"
          trap 'rm -rf "$WORK"; rm -f "$ARCHIVE"' EXIT
          supabase --version
          supabase db dump --remote="$SUPABASE_DB_URL" --role-only --file "$WORK/roles.sql"
          supabase db dump --remote="$SUPABASE_DB_URL" --file "$WORK/schema.sql"
          supabase db dump --remote="$SUPABASE_DB_URL" --data-only --use-copy \
            --exclude "storage.buckets_vectors" \
            --exclude "storage.vector_indexes" \
            --file "$WORK/data.sql"
          test -s "$WORK/roles.sql"
          test -s "$WORK/schema.sql"
          test -s "$WORK/data.sql"
          grep -Eq 'CREATE TABLE|CREATE SCHEMA|CREATE TYPE|CREATE FUNCTION' "$WORK/schema.sql"
          (
            cd "$WORK"
            sha256sum roles.sql schema.sql data.sql > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          cat > "$WORK/manifest.txt" <<EOF
          backup_created_utc=$STAMP
          project_ref=zgfdvhzhvccsfmpoaqah
          postgres_major=17
          export_format=Supabase CLI logical SQL dumps
          files=roles.sql,schema.sql,data.sql,SHA256SUMS
          exclusions=Supabase-managed auth/storage/extension schemas; storage object bytes
          restore_policy=restore to an isolated target first; never overwrite production as a test
          EOF
          tar -czf "$ARCHIVE" -C "$WORK" roles.sql schema.sql data.sql SHA256SUMS manifest.txt
          tar -tzf "$ARCHIVE" >/dev/null
          age --encrypt --recipient "$BACKUP_AGE_RECIPIENT" --output "$ARCHIVE.age" "$ARCHIVE"
          test -s "$ARCHIVE.age"
          head -n 1 "$ARCHIVE.age" | grep -qx 'age-encryption.org/v1'
          rm -f "$ARCHIVE"
          echo "archive=$ARCHIVE.age" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          ls -lh "$ARCHIVE.age"

      - name: Upload encrypted GitHub recovery copy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mf-terminal-intelligence-db-backup-${{ steps.backup.outputs.stamp }}
          path: ${{ steps.backup.outputs.archive }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Copy encrypted backup to mandatory off-site storage
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_ARCHIVE="${{ steps.backup.outputs.archive }}"
          DAILY_KEY="mf-terminal-intelligence/daily/${{ steps.backup.outputs.stamp }}.tar.gz.age"
          aws s3 cp "$LOCAL_ARCHIVE" "s3://$BACKUP_S3_BUCKET/$DAILY_KEY" \
            --endpoint-url "$BACKUP_S3_ENDPOINT" --region auto --no-progress
          LOCAL_SIZE="$(stat -c%s "$LOCAL_ARCHIVE")"
          REMOTE_SIZE="$(aws s3api head-object --bucket "$BACKUP_S3_BUCKET" --key "$DAILY_KEY" \
            --endpoint-url "$BACKUP_S3_ENDPOINT" --region auto --query ContentLength --output text)"
          [[ "$LOCAL_SIZE" == "$REMOTE_SIZE" ]] || { echo "::error::Daily R2 backup size verification failed."; exit 1; }

          REMOTE_COPY="$RUNNER_TEMP/r2-verified-${{ steps.backup.outputs.stamp }}.tar.gz.age"
          REMOTE_COPY_MONTHLY=""
          trap 'rm -f "$REMOTE_COPY" "$REMOTE_COPY_MONTHLY"' EXIT
          aws s3 cp "s3://$BACKUP_S3_BUCKET/$DAILY_KEY" "$REMOTE_COPY" \
            --endpoint-url "$BACKUP_S3_ENDPOINT" --region auto --no-progress
          LOCAL_SHA256="$(sha256sum "$LOCAL_ARCHIVE" | awk '{print $1}')"
          REMOTE_SHA256="$(sha256sum "$REMOTE_COPY" | awk '{print $1}')"
          [[ "$LOCAL_SHA256" == "$REMOTE_SHA256" ]] || { echo "::error::Daily R2 backup SHA-256 verification failed."; exit 1; }

          if [[ "$(date -u +%d)" == "01" ]]; then
            MONTHLY_KEY="mf-terminal-intelligence/monthly/$(date -u +%Y-%m).tar.gz.age"
            aws s3 cp "$LOCAL_ARCHIVE" "s3://$BACKUP_S3_BUCKET/$MONTHLY_KEY" \
              --endpoint-url "$BACKUP_S3_ENDPOINT" --region auto --no-progress
            MONTHLY_REMOTE_SIZE="$(aws s3api head-object --bucket "$BACKUP_S3_BUCKET" --key "$MONTHLY_KEY" \
              --endpoint-url "$BACKUP_S3_ENDPOINT" --region auto --query ContentLength --output text)"
            [[ "$LOCAL_SIZE" == "$MONTHLY_REMOTE_SIZE" ]] || { echo "::error::Monthly R2 backup size verification failed."; exit 1; }
            REMOTE_COPY_MONTHLY="$RUNNER_TEMP/r2-verified-monthly-${{ steps.backup.outputs.stamp }}.tar.gz.age"
            aws s3 cp "s3://$BACKUP_S3_BUCKET/$MONTHLY_KEY" "$REMOTE_COPY_MONTHLY" \
              --endpoint-url "$BACKUP_S3_ENDPOINT" --region auto --no-progress
            MONTHLY_REMOTE_SHA256="$(sha256sum "$REMOTE_COPY_MONTHLY" | awk '{print $1}')"
            [[ "$LOCAL_SHA256" == "$MONTHLY_REMOTE_SHA256" ]] || { echo "::error::Monthly R2 backup SHA-256 verification failed."; exit 1; }
          fi
          echo "Encrypted daily off-site copy uploaded, downloaded, size-verified and SHA-256 verified: s3://$BACKUP_S3_BUCKET/$DAILY_KEY"


      - name: Remove encrypted runner copy
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/mf-terminal-intelligence-*.tar.gz.age "$RUNNER_TEMP"/r2-verified-*.tar.gz.age*
