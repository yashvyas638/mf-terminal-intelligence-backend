name: P0 Production Readiness Audit

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-production-readiness-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: \${{ secrets.SUPABASE_DB_URL }}
      MF_TERMINAL_API_URL: \${{ secrets.MF_TERMINAL_API_URL }}
      MF_TERMINAL_API_KEY: \${{ secrets.MF_TERMINAL_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned PostgreSQL driver
        run: python -m pip install "psycopg[binary]==3.3.8"

      - name: Run read-only production readiness audit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/p0_production_audit.py
          python scripts/p0_production_audit.py | tee p0-audit-report.json

      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-production-audit-\${{ github.run_id }}
          path: p0-audit-report.json
          if-no-files-found: warn
          retention-days: 30
