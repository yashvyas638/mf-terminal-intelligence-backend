name: P0 Production Readiness Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p0-production-readiness.yml"
      - "scripts/p0_production_audit.py"
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: p0-production-readiness-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MF_TERMINAL_API_URL: https://mf-terminal-intelligence-backend.onrender.com
      MF_TERMINAL_API_KEY: ${{ secrets.MF_TERMINAL_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate audit script syntax
        run: python -m py_compile scripts/p0_production_audit.py

      - name: Validate audit configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$SUPABASE_DB_URL" ]] || missing+=("SUPABASE_DB_URL")
          [[ -n "$MF_TERMINAL_API_KEY" ]] || missing+=("MF_TERMINAL_API_KEY")
          if (( \${#missing[@]} )); then
            MISSING_SECRETS="\${missing[*]}" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          with open("p0-audit-report.json", "w", encoding="utf-8") as report:
              json.dump({
                  "result": "BLOCKED_CONFIGURATION",
                  "checked_at_utc": datetime.now(timezone.utc).isoformat(),
                  "missing_secrets": os.environ["MISSING_SECRETS"].split(),
                  "note": "No production endpoint or database checks were attempted."
              }, report, indent=2)
          PY
            printf '::error::Missing required GitHub Actions secrets: %s\n' "\${missing[*]}"
            exit 1
          fi
          [[ "$SUPABASE_DB_URL" == postgres://* || "$SUPABASE_DB_URL" == postgresql://* ]] || {
            echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection URI.";
            exit 1;
          }

      - name: Install pinned PostgreSQL driver
        run: python -m pip install "psycopg[binary]==3.3.8"

      - name: Run read-only production readiness audit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/p0_production_audit.py
          python scripts/p0_production_audit.py | tee p0-audit-report.json

      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p0-production-audit-${{ github.run_id }}
          path: p0-audit-report.json
          if-no-files-found: warn
          retention-days: 30
