name: CI
on:
  push:
    branches: [main, audit/production-foundation, feature/research-layer-integration, feature/research-layer-integration-sync]
  pull_request:
    branches: [main, audit/production-foundation]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.16"
          cache: pip
      - run: pip install -r requirements.lock
      - name: Apply SQLite baseline through existing production revision
        run: alembic upgrade 0003_nav_correction_history
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
      - name: Apply remaining SQLite migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
      - name: Lint
        run: ruff check --select F,B .
      - name: Validate dashboard and research JavaScript
        run: |
          node --check app/static/dashboard.js
          node --check app/static/research.js
      - name: Test SQLite
        run: python -m pytest -q
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db

  test-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mf_terminal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mf_terminal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mf_terminal_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.16"
          cache: pip
      - run: pip install -r requirements.lock
      - name: Create Supabase client-role test fixtures
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as connection:
              connection.exec_driver_sql("""
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
                  CREATE ROLE anon NOLOGIN;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
                  CREATE ROLE authenticated NOLOGIN;
                END IF;
              END
              $$;
              """)
          PY
      - name: Apply PostgreSQL baseline through existing production revision
        run: alembic upgrade 0003_nav_correction_history
      - name: Apply remaining PostgreSQL migrations
        run: alembic upgrade head
      - name: Test PostgreSQL
        run: python -m pytest -q
