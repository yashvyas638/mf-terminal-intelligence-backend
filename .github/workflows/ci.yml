name: CI
on:
  push:
    branches: [main, audit/production-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: DATABASE_URL=sqlite:///./ci_migrations.db alembic upgrade head
      - run: ruff check --select F,B .
      - run: python -m pytest -q
