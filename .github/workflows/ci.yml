name: CI
on:
  push:
    branches: [main, audit/production-foundation, feature/auth-onboarding-and-session-fixes, feature/research-layer-integration, feature/research-layer-integration-sync, feature/research-layer-integration-verified, fix/0009-production-trigger-reconciliation]
  pull_request:
    branches: [main, audit/production-foundation]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply SQLite baseline through existing production revision
        run: alembic upgrade 0003_nav_correction_history
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
      - name: Apply remaining SQLite migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
      - name: Lint
        run: ruff check --select F,B .
      - name: Validate dashboard and research JavaScript
        run: |
          node --check app/static/dashboard.js
          node --check app/static/research.js
          node --check app/static/fund-detail.js
      - name: Validate authentication and portfolio DOM contracts
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          contracts = {
              "app/static/dashboard.html": {
                  "authForm", "authEmail", "authPassword", "signIn", "signUp",
                  "resetPassword", "signOut", "passwordRecoveryPanel", "saveNewPassword",
                  "newPassword", "portfolioCommandCentre", "commandCentreStatus", "ccMarketValue", "ccCostBasis", "ccUnrealized", "ccPortfolioCount", "ccPortfolioCards", "portfolioOverview", "portfolioCurrentValue",
                  "portfolioCostBasis", "portfolioRealized", "portfolioUnrealized",
                  "portfolioTotalGain", "portfolioXirr", "portfolioValuationDate",
                  "portfolioValuationStatus", "holdingCount", "holdingRows",
                  "portfolioRiskStatus", "portfolioRiskDays", "loadPortfolioRisk",
                  "portfolioRiskResult", "stressScenarioName", "stressShockPct",
                  "runPortfolioStress", "portfolioStressResult", "loadTaxLots", "taxLotsResult", "generatePortfolioReport", "portfolioReportResult", "refreshPortfolioReports", "portfolioReportCount", "portfolioReportHistory",
                  "transactionForm", "transactionRows", "transactionCount",
                  "transactionMessage", "addTransaction", "refreshTransactions",
                  "goalsWorkspace", "goalForm", "goalName", "goalTarget", "goalDate", "goalPortfolio", "lookthroughAgeDays", "loadLookthrough", "lookthroughCoverage", "lookthroughSecurities",
                  "goalCurrent", "goalMonthly", "goalInflation", "goalReturnLow",
                  "goalReturnBase", "goalReturnHigh", "createGoal", "goalCount",
                  "goalList", "goalProjection", "filterAmc", "filterCategory", "filterAsset", "filterPlan", "filterOption", "clearFilters", "fundPrev", "fundNext", "fundPageLabel", "fundResultCount",
              },
              "app/static/research.html": {
                  "researchAuthForm", "authEmail", "authPassword", "signIn", "signUp",
                  "resetPassword", "signOut", "researchRecoveryPanel", "newPassword",
                  "saveNewPassword", "authStatus", "notice", "fundRows", "watchlist", "watchlistRows", "refreshWatchlist", "category", "assetClass", "sortBy", "sortOrder", "minObservations", "screenerFreshness", "overlap", "overlapSchemeA", "overlapSchemeB", "runOverlap", "overlapBody",
              },
          }
          for filename, required in contracts.items():
              source = Path(filename).read_text(encoding="utf-8")
              present = set(re.findall(r'id="([^"]+)"', source))
              missing = sorted(required - present)
              if missing:
                  raise SystemExit(f"{filename} is missing required DOM ids: {missing}")
          from html.parser import HTMLParser

          class StructureCheck(HTMLParser):
              VOID = {"area", "base", "br", "col", "embed", "hr", "img", "input", "link", "meta", "param", "source", "track", "wbr"}
              def __init__(self):
                  super().__init__()
                  self.stack = []
                  self.ancestors = {}
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  node_id = attrs.get("id")
                  if node_id:
                      self.ancestors[node_id] = list(self.stack)
                  if tag not in self.VOID:
                      self.stack.append((tag, attrs))
              def handle_endtag(self, tag):
                  for index in range(len(self.stack) - 1, -1, -1):
                      if self.stack[index][0] == tag:
                          del self.stack[index:]
                          break

          parser = StructureCheck()
          parser.feed(Path("app/static/dashboard.html").read_text(encoding="utf-8"))
          portfolio_ancestors = parser.ancestors.get("portfolioOverview", [])
          if any(attrs.get("class", "").find("filebox") >= 0 for _, attrs in portfolio_ancestors):
              raise SystemExit("Portfolio overview must not be nested inside an import/rebalance filebox.")
          if any(attrs.get("class", "").find("formgrid") >= 0 for _, attrs in portfolio_ancestors):
              raise SystemExit("Portfolio overview must be outside the portfolio setup form grid.")
          print("Dashboard and Research Terminal DOM contracts and layout passed.")
          PY
      - name: Test SQLite
        run: python -m pytest -q
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db

  test-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mf_terminal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mf_terminal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mf_terminal_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create Supabase client-role test fixtures
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as connection:
              connection.exec_driver_sql("""
              DO $roles$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
                  CREATE ROLE anon NOLOGIN;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
                  CREATE ROLE authenticated NOLOGIN;
                END IF;
              END
              $roles$;
              CREATE SCHEMA IF NOT EXISTS auth;
              CREATE OR REPLACE FUNCTION auth.uid()
              RETURNS uuid
              LANGUAGE sql
              STABLE
              AS $uid$ SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $uid$;
              GRANT USAGE ON SCHEMA auth TO authenticated;
              GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
              """)
          PY
      - name: Apply PostgreSQL baseline through existing production revision
        run: alembic upgrade 0003_nav_correction_history
      - name: Apply remaining PostgreSQL migrations
        run: alembic upgrade head
      - name: Test PostgreSQL
        run: python -m pytest -q

  validate-amfi-history-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
          cache: pip
      - run: pip install -r requirements.lock
      - name: Live read-only AMFI historical response contract check for all scheme types
        run: |
          python - <<'PY'
          import json
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo

          import requests

          from app.nav_backfill import HistoryWindow
          from app.nav_history import parse_amfi_history_text
          from app.nav_history_source import build_amfi_history_url

          end_date = datetime.now(ZoneInfo("Asia/Kolkata")).date() - timedelta(days=1)
          start_date = end_date - timedelta(days=6)
          window = HistoryWindow(start_date, end_date)
          summaries = []

          for scheme_type in (1, 2, 3):
              url = build_amfi_history_url(window, scheme_type)
              response = requests.get(
                  url,
                  timeout=(5, 25),
                  headers={
                      "User-Agent": "MF-Terminal-Intelligence-History-Contract-Test/1.0",
                      "Accept": "text/plain, application/octet-stream;q=0.9, */*;q=0.5",
                  },
              )
              response.raise_for_status()
              if len(response.content) > 30_000_000:
                  raise SystemExit(f"AMFI type {scheme_type} response exceeded 30 MB safety limit")
              payload = response.content.decode("utf-8-sig", errors="strict")
              if not payload.strip() or "<html" in payload[:512].lower():
                  raise SystemExit(f"AMFI type {scheme_type} returned empty or HTML content")

              records, report = parse_amfi_history_text(payload)
              if report.get("header_verified") is not True:
                  raise SystemExit(f"AMFI type {scheme_type} header was not verified")
              if report["records_valid"] < (1000 if scheme_type == 1 else 1):
                  raise SystemExit(
                      f"AMFI type {scheme_type} returned only {report['records_valid']} valid rows"
                  )
              if any(row.nav_date < start_date or row.nav_date > end_date for row in records):
                  raise SystemExit(f"AMFI type {scheme_type} returned dates outside requested range")

              summaries.append({
                  "scheme_type": scheme_type,
                  "source": url,
                  "http_status": response.status_code,
                  "requested_start_date": start_date.isoformat(),
                  "requested_end_date": end_date.isoformat(),
                  "bytes_received": len(response.content),
                  "records_valid": report["records_valid"],
                  "unique_scheme_codes": report["unique_scheme_codes"],
                  "min_nav_date": report["min_nav_date"],
                  "max_nav_date": report["max_nav_date"],
                  "schema_variant": report["schema_variant"],
                  "invalid_rows": report["invalid_rows"],
                  "invalid_issue_counts": report["invalid_issue_counts"],
                  "payload_sha256": report["payload_sha256"],
              })

          print(json.dumps({"scheme_type_checks": summaries, "database_writes": 0}, indent=2))
          historical_window = HistoryWindow(date(2021, 11, 12), date(2021, 11, 18))
          historical_url = build_amfi_history_url(historical_window, 1)
          historical_response = requests.get(
              historical_url,
              timeout=(5, 25),
              headers={"User-Agent": "MF-Terminal-Intelligence-History-Contract-Test/1.0"},
          )
          historical_response.raise_for_status()
          historical_payload = historical_response.content.decode("utf-8-sig", errors="strict")
          historical_records, historical_report = parse_amfi_history_text(historical_payload)
          if historical_report["records_valid"] < 1:
              raise SystemExit("First planned historical checkpoint returned no valid NAV rows")
          if any(
              row.nav_date < historical_window.start_date
              or row.nav_date > historical_window.end_date
              for row in historical_records
          ):
              raise SystemExit("First planned historical checkpoint contains out-of-range dates")

          print(json.dumps({
              "scheme_type_checks": summaries,
              "first_planned_checkpoint": {
                  "scheme_type": 1,
                  "source": historical_url,
                  "start_date": historical_window.start_date.isoformat(),
                  "end_date": historical_window.end_date.isoformat(),
                  "records_valid": historical_report["records_valid"],
                  "unique_scheme_codes": historical_report["unique_scheme_codes"],
                  "schema_variant": historical_report["schema_variant"],
                  "invalid_rows": historical_report["invalid_rows"],
                  "max_scheme_name_length": max(len(row.scheme_name) for row in historical_records),
                  "max_isin_length": max(
                      max(len(row.isin_growth or ""), len(row.isin_dividend_reinvestment or ""))
                      for row in historical_records
                  ),
                  "max_plan_type_length": max(len(row.plan_type or "") for row in historical_records),
                  "max_option_type_length": max(len(row.option_type or "") for row in historical_records),
                  "oversized_plan_types": sorted({
                      row.plan_type for row in historical_records
                      if row.plan_type and len(row.plan_type) > 20
                  }),
                  "oversized_option_types": sorted({
                      row.option_type for row in historical_records
                      if row.option_type and len(row.option_type) > 20
                  }),
                  "max_nav_value": str(max(row.nav for row in historical_records)),
                  "payload_sha256": historical_report["payload_sha256"]
              },
              "database_writes": 0,
          }, indent=2))
          PY
