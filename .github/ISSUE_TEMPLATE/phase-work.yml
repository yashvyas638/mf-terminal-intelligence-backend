name: Phase work item
description: Track one scoped feature, fix, audit or validation task in the P0-P6 roadmap.
title: "[P0] "
labels: ["phase-work"]
body:
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options:
        - P0 — Foundation, security, NAV reliability and portfolio import
        - P1 — Fund research, performance and risk
        - P2 — Holdings overlap and quantitative research
        - P3 — Macro intelligence and stress testing
        - P4 — Portfolio optimisation and Decision Centre
        - P5 — Tax, wealth projections, monitoring and reports
        - P6 — AI research assistant and production hardening
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Work type
      options:
        - Feature
        - Bug
        - Security
        - Data quality
        - Migration
        - Research
        - UX
        - Operations
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
      description: What should the user be able to do or trust after this work?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Write observable, testable pass/fail conditions.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals and do-not-do
      description: State what must not change, especially production data and security boundaries.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk class
      options:
        - R0 — Documentation only
        - R1 — Isolated code, no schema/data migration
        - R2 — Additive schema migration
        - R3 — Data migration/backfill
        - R4 — Destructive or irreversible
    validations:
      required: true
  - type: textarea
    id: test_plan
    attributes:
      label: Test and evidence plan
      description: Include PostgreSQL, migrations, API/UI, security and reconciliation tests where relevant.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmations
      options:
        - label: No credentials or personal financial data will be committed or logged.
          required: true
        - label: No destructive production operation will run without explicit approval and verified recovery.
          required: true
        - label: Work will remain on the authorised feature branch unless explicitly approved otherwise.
          required: true
